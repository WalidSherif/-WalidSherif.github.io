title: Walid Sherif — Renewable Energy & Power Systems Engineer
email: waleedshereef65@gmail.com
description: Portfolio of Walid Sherif — power-systems analysis, grid-aware data-center optimization, renewable-energy integration, power electronics, and computational engineering.
url: "https://walidsherif.github.io"
baseurl: ""

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: projects
    values:
      layout: project

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

github:
  is_project_page: false
